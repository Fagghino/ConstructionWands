# Configuration file for ConstructionWands plugin
# Define custom construction wands and messages
# Each wand has specific attributes like name, model data, 
# range, length, delay, source hand, type, uses, and whether it is infinite.
# Source: inventory | offhand
# Modify the values as needed to customize your wands.
# Wands can be given to players using the /wand command defined in plugin.yml
# Ensure that the permissions are set correctly in plugin.yml to control access to the commands.
# Example wands are provided below.

# Blocked blocks - blocks on which wands cannot place blocks
# Add any Minecraft material name to prevent placement on those blocks
blocked-blocks:
  - SPAWNER
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - STRUCTURE_BLOCK
  - JIGSAW
  - END_PORTAL_FRAME
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - FURNACE
  - DISPENSER
  - DROPPER
  - HOPPER
  - ANVIL
  - ENDER_CHEST

wands:
  basic_wand:
    name: "&6Bacchetta Base"
    model-data: 1001
    lore:
      - "&7Range: 1x1x1"
      - "&7Click destro per piazzare blocchi"
      - "&7Click sinistro per annullare l'ultimo piazzamento"
      - "&eUSES RIMANENTI: {uses}"
    range: 1
    length: 1
    delay: 0
    source: offhand
    type: BLAZE_ROD
    uses: 100
    infinite: false
    enable-undo: true

  medium_wand:
    name: "&aBacchetta Media"
    model-data: 1002
    lore:
      - "&7Range: 3x3x1"
      - "&7Click destro per piazzare blocchi"
      - "&7Click sinistro per annullare l'ultimo piazzamento"
      - "&eUSES RIMANENTI: {uses}"
    range: 3
    length: 1
    delay: 0
    source: offhand
    type: STICK
    uses: 50
    infinite: false
    enable-undo: true

  advanced_wand:
    name: "&cBacchetta Avanzata"
    model-data: 1003
    lore:
      - "&7Range: 5x5x1"
      - "&7Click destro per piazzare blocchi"
      - "&7Click sinistro per annullare l'ultimo piazzamento"
      - "&dINFINITA!"
    range: 5
    length: 1
    delay: 0
    source: offhand
    type: BLAZE_ROD
    uses: -1
    infinite: true
    enable-undo: true

# Undo timeout in milliseconds (60000 = 60 seconds)
undo-timeout: 60000

messages:
  no-permission: "&cNon hai il permesso per usare questo comando!"
  wand-given: "&aHai ricevuto una {wand}!"
  wand-not-found: "&cBacchetta non trovata!"
  no-blocks: "&cNon hai abbastanza blocchi nella mano secondaria!"
  no-blocks-inventory: "&cNon hai abbastanza blocchi nell'inventario!"
  no-island-permission: "&cNon hai il permesso per costruire su questa isola!"
  blocked-block: "&cNon puoi piazzare questo blocco con la bacchetta!"
  cooldown: "&cDevi aspettare prima di usare nuovamente la bacchetta!"
  uses-depleted: "&cLa bacchetta ha esaurito gli usi!"
  undo-success: "&aAnnullamento riuscito! Rimossi %blocks% blocchi."
  undo-timeout-expired: "&cTempo scaduto! Non puoi più annullare questo piazzamento."
  undo-no-placement: "&cNon c'è niente da annullare!"
  undo-blocks-changed: " &e%changed% blocchi sono stati già modificati."
