name: ConstructionWands
version: '1.0-SNAPSHOT'
main: com.franchino961.constructionwands.ConstructionWands
api-version: '1.20'
author: Franchino961
description: Plugin per bacchette di costruzione personalizzate
softdepend:
  - SuperiorSkyblock2
  
commands:
  wand:
    description: Gestione bacchette di costruzione
    usage: /wand <give|reload|list> [args...]
    permission: constructionwands.admin
    permission-message: Non hai il permesso per usare questo comando!

permissions:
  constructionwands.admin:
    description: Permesso amministratore per gestire le bacchette
    default: op
  constructionwands.use:
    description: Permesso per usare le bacchette
    default: true
